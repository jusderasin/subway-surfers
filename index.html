<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sky Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#ffd23f;--mag:#ff3fd0;--cy:#2ff3ff;--glass:rgba(10,12,32,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#05060f;color:#fff;font-family:Fredoka,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button{pointer-events:auto;font-family:inherit;cursor:pointer}

/* HUD */
#hud{position:absolute;inset:0}
.hud-l{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px}
#score{font-size:clamp(32px,7vw,52px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #0007,0 0 24px #0006}
#multi{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;background:var(--acc);color:#3a2500;font-weight:700;font-size:16px}
.hud-r{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;display:flex;gap:10px;align-items:center}
.coinbox{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff1f;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.ci{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2,#ffc928 45%,#b07800);box-shadow:0 0 12px #ffc92888}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff2a;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:18px;font-weight:700}
#powers{position:absolute;top:calc(74px + env(safe-area-inset-top));left:16px;display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff22}
.chip .ic{font-size:20px;width:26px;text-align:center;font-weight:700}
.chip i{display:block;width:90px;height:8px;border-radius:5px;background:#ffffff22;overflow:hidden}
.chip b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cy),var(--mag))}

#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(32vw,190px);font-weight:700;text-shadow:0 10px 0 #0006,0 0 60px #fff6}
#count.pop{animation:pop .6s ease-out both}
@keyframes pop{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:0}}

/* MENU */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,#000a,transparent 28%,transparent 52%,#000c)}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{margin-top:min(4vh,30px);text-align:center;line-height:.82;font-weight:700;letter-spacing:1px;animation:float 4s ease-in-out infinite}
.logo .a{display:block;font-size:clamp(50px,13vw,104px);background:linear-gradient(#fff 20%,#ffd23f 80%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #a86b00) drop-shadow(0 0 30px #ffd23f55)}
.logo .b{display:block;font-size:clamp(40px,10.5vw,84px);background:linear-gradient(90deg,var(--cy),#9b7bff,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #3a1570) drop-shadow(0 0 30px #ff3fd055)}
@keyframes float{50%{transform:translateY(-6px)}}
.tabs{margin-top:18px;display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #ffffff1f}
.tabs button{border:0;border-radius:999px;padding:10px 18px;font-size:16px;font-weight:600;color:#fff;background:transparent;transition:.2s}
.tabs button.on{background:#fff;color:#141428;box-shadow:0 4px 18px #fff4}
.spacer{flex:1}
.panel{pointer-events:auto;width:min(520px,100%);padding:18px;border-radius:28px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff22;box-shadow:0 20px 60px #0008;display:flex;flex-direction:column;gap:14px;align-items:center}
.sel{width:100%;display:flex;align-items:center;gap:10px}
.arrow{flex:none;width:54px;height:54px;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff14;color:#fff;font-size:30px;line-height:1}
.arrow:active{transform:scale(.92)}
.info{flex:1;text-align:center}
#skinName{font-size:22px;font-weight:700}
#skinSub{font-size:15px;opacity:.8;margin-top:2px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots span{width:8px;height:8px;border-radius:50%;background:#ffffff40}
.dots span.on{background:var(--acc);width:20px;border-radius:4px}
.cta{width:100%;border:0;border-radius:20px;padding:16px;font-size:26px;font-weight:700;letter-spacing:1px;color:#3a2500;background:linear-gradient(#ffe57a,#ffb800);box-shadow:0 6px 0 #c47f00,0 12px 34px #ffb80055;transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f00}
.cta.dis{filter:grayscale(1) brightness(.8);pointer-events:none}
.ghost{width:100%;border:1px solid #ffffff33;border-radius:18px;padding:12px;font-size:18px;font-weight:600;color:#fff;background:#ffffff12}
.hint{font-size:13px;opacity:.65;text-align:center}
.bank{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff1f;font-weight:700;font-size:18px}

/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#05060fb0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
.ocard{width:min(420px,100%);padding:24px 20px;border-radius:30px;background:linear-gradient(160deg,#1b1f45ee,#0b0d22ee);border:1px solid #ffffff22;box-shadow:0 30px 80px #000a;display:flex;flex-direction:column;gap:14px;align-items:center;animation:rise .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.otitle{font-size:44px;font-weight:700;background:linear-gradient(#fff,#ff8aa0);-webkit-background-clip:text;background-clip:text;color:transparent}
#newRec{padding:6px 16px;border-radius:999px;background:linear-gradient(90deg,#ffd23f,#ff8a00);color:#3a2500;font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.stats{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{padding:12px 6px;border-radius:16px;background:#ffffff10;text-align:center}
.stats small{display:block;font-size:12px;opacity:.65;letter-spacing:1px}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="hud-l"><div id="score">0</div><div id="multi" class="hidden">x2</div></div>
    <div class="hud-r"><div class="coinbox"><span class="ci"></span><span id="coins">0</span></div><button id="pauseBtn" class="iconbtn" aria-label="Pause">❚❚</button></div>
    <div id="powers"></div>
  </div>
  <div id="count" class="hidden"></div>

  <div id="menu">
    <div class="topbar">
      <div class="bank"><span class="ci"></span><span id="bank">0</span></div>
      <button id="muteBtn" class="iconbtn" aria-label="Son">🔊</button>
    </div>
    <div class="logo"><span class="a">SKY</span><span class="b">RUNNER</span></div>
    <div class="tabs"><button data-w="city">🚀 Néo City</button><button data-w="farm">🐄 Ferme Paradis</button></div>
    <div class="spacer"></div>
    <div class="panel">
      <div class="sel">
        <button id="prev" class="arrow" aria-label="Précédent">‹</button>
        <div class="info"><div id="skinName"></div><div id="skinSub"></div><div class="dots" id="dots"></div></div>
        <button id="next" class="arrow" aria-label="Suivant">›</button>
      </div>
      <button id="play" class="cta">JOUER</button>
      <div class="hint">Record <b id="best">0</b> · PC : ← → ↑ ↓ · Mobile : glisse le doigt</div>
    </div>
  </div>

  <div id="pause" class="overlay hidden"><div class="ocard">
    <div class="otitle" style="background:linear-gradient(#fff,#9bd7ff);-webkit-background-clip:text;background-clip:text">PAUSE</div>
    <button id="resume" class="cta">REPRENDRE</button>
    <button id="quit" class="ghost">Menu</button>
  </div></div>

  <div id="over" class="overlay hidden"><div class="ocard">
    <div class="otitle">CRASH !</div>
    <div id="newRec" class="hidden">🏆 NOUVEAU RECORD</div>
    <div class="stats">
      <div><small>SCORE</small><b id="fScore">0</b></div>
      <div><small>PIÈCES</small><b id="fCoins">0</b></div>
      <div><small>RECORD</small><b id="fBest">0</b></div>
    </div>
    <button id="again" class="cta">REJOUER</button>
    <button id="toMenu" class="ghost">Menu</button>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
// ================= Utilitaires =================
const MOBILE = matchMedia('(pointer:coarse)').matches;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const store = {
  get(k, d) { try { const v = localStorage.getItem('skyr_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('skyr_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ================= Données =================
const SKINS = {
  city: [
    { id: 'white', name: 'Roadster Arctique',    color: 0xf4f6f8, price: 0 },
    { id: 'red',   name: 'Roadster Rouge Sang',  color: 0xb3001b, price: 150 },
    { id: 'blue',  name: 'Roadster Bleu Abysse', color: 0x0c2d8a, price: 300 },
    { id: 'black', name: 'Roadster Obsidienne',  color: 0x0b0b0d, price: 600 },
    { id: 'cyber', name: 'Cyber Truck',          color: 0xc9ccd1, price: 1200, truck: true },
    { id: 'gold',  name: 'Roadster Or 24K',      color: 0xffc23a, price: 3000, gold: true },
  ],
  farm: [
    { id: 'cow',     name: 'Marguerite la Vache', kind: 'cow',     price: 0 },
    { id: 'pig',     name: 'Rosette le Cochon',   kind: 'pig',     price: 150 },
    { id: 'sheep',   name: 'Flocon le Mouton',    kind: 'sheep',   price: 300 },
    { id: 'chick',   name: 'Pioupiou le Poussin', kind: 'chick',   price: 600 },
    { id: 'goldcow', name: 'Vache Dorée',         kind: 'goldcow', price: 3000 },
  ]
};
const save = {
  bank: store.get('bank', 0), best: store.get('best', 0),
  owned: store.get('owned', ['white', 'cow']),
  chosen: store.get('chosen', { city: 'white', farm: 'cow' }),
  world: store.get('world', 'city'), mute: store.get('mute', false)
};
const persist = () => Object.keys(save).forEach(k => store.set(k, save[k]));
let world = save.world === 'farm' ? 'farm' : 'city';
const previewIdx = { city: 0, farm: 0 };

const THEMES = {
  city: {
    top: 0x02030c, hor: 0x4a1a6a, bot: 0x07030f, fog: 0x2a1046, fogNear: 30, fogFar: 210,
    hemi: [0x6677ff, 0x1a0022, .55], sun: [0xc0a8ff, .85], sunPos: [-14, 30, 12],
    bloom: [.85, .55, .45], ring: 0x2ff3ff,
    env: [[0xff3fd0, -30, 8, -20, 40, 6], [0x2ff3ff, 30, 12, 10, 40, 6], [0xffffff, 0, 60, 0, 30, 30], [0x8866ff, 0, 10, 40, 50, 10]]
  },
  farm: {
    top: 0x2a78e0, hor: 0xd9f0ff, bot: 0x6aa84f, fog: 0xcfe8fb, fogNear: 60, fogFar: 270,
    hemi: [0xffffff, 0x6a8f3a, .8], sun: [0xfff1d6, 1.45], sunPos: [-22, 34, 16],
    bloom: null, ring: 0xffd23f,
    env: [[0xffffff, 0, 60, 0, 50, 50], [0xfff0c0, -40, 20, 30, 30, 15], [0x88c060, 0, -20, 0, 80, 80]]
  }
};

// ================= Rendu =================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 650);
const pmrem = new THREE.PMREMGenerator(renderer);

let composer = null, bloom = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1, .55, .3);
  composer.addPass(bloom);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (composer) composer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, .7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 90 });
sun.shadow.bias = -.0005;
scene.add(sun, sun.target);

// ================= Textures procédurales =================
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function glowTexture() {
  const [c, x] = canvas(64, 64);
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.3, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
function windowTexture() {
  const [c, x] = canvas(64, 128);
  x.fillStyle = '#05060c'; x.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 128; y += 8) for (let xx = 3; xx < 64; xx += 8) {
    if (Math.random() < .42) { x.globalAlpha = rnd(.45, 1); x.fillStyle = pick(['#ffcf7a', '#ffe7b0', '#7ad7ff', '#ff7ad9', '#b9a0ff', '#ffffff']); }
    else { x.globalAlpha = 1; x.fillStyle = '#0d1020'; }
    x.fillRect(xx, y, 5, 4);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function gridTexture() {
  const [c, x] = canvas(128, 128);
  x.fillStyle = '#06020f'; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = '#ff2fd0'; x.lineWidth = 3; x.shadowColor = '#ff2fd0'; x.shadowBlur = 8; x.strokeRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(70, 10);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
function noiseTexture(base, cols, rx, ry, n = 1400) {
  const [c, x] = canvas(256, 256);
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < n; i++) { x.fillStyle = pick(cols); x.globalAlpha = rnd(.3, .8); const s = rnd(1, 4); x.fillRect(Math.random() * 256, Math.random() * 256, s, s); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
function signTexture(text, c1, c2) {
  const [c, x] = canvas(256, 128);
  const g = x.createLinearGradient(0, 0, 256, 128); g.addColorStop(0, c1); g.addColorStop(1, c2);
  x.fillStyle = '#05030c'; x.fillRect(0, 0, 256, 128);
  x.strokeStyle = g; x.lineWidth = 8; x.strokeRect(6, 6, 244, 116);
  x.font = '700 64px Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = c1; x.shadowBlur = 20; x.fillStyle = g; x.fillText(text, 128, 68);
  return new THREE.CanvasTexture(c);
}
const emojiCache = {};
function emojiTex(e) {
  if (emojiCache[e]) return emojiCache[e];
  const [c, x] = canvas(128, 128);
  x.font = e.length > 2 ? '700 70px Fredoka, sans-serif' : '92px serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  x.fillText(e, 64, 72);
  return emojiCache[e] = new THREE.CanvasTexture(c);
}
const T_GLOW = glowTexture(), T_WIN = windowTexture(), T_GRID = gridTexture();
const T_DIRT = noiseTexture('#a5774a', ['#7d5634', '#bf9262', '#8c6440'], 2, 8);
const T_GRASS = noiseTexture('#5aa83a', ['#4a9330', '#6cbd45', '#3f8028', '#7ccc55'], 40, 8, 2200);
const T_SIGNS = [signTexture('NEO', '#ff3fd0', '#2ff3ff'), signTexture('FLY', '#2ff3ff', '#9b7bff'), signTexture('2099', '#ffd23f', '#ff3fd0'), signTexture('SKY', '#ff8a00', '#ff2fd0')];

// ================= Matériaux =================
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .6, metalness: .05 }, o));
const basic = c => new THREE.MeshBasicMaterial({ color: c });
const MAT = {
  road: std(0x0f1119, { metalness: .75, roughness: .3 }),
  metal: std(0x1a1d2b, { metalness: .85, roughness: .3 }),
  cyan: basic(0x2ff3ff), mag: basic(0xff2fd0), orange: basic(0xff9a1f), red: basic(0xff1f3d), white: basic(0xffffff), violet: basic(0x9b7bff),
  grid: new THREE.MeshBasicMaterial({ map: T_GRID }),
  bld: [0x0e1222, 0x151a30, 0x1c1630].map(c => std(c, { metalness: .85, roughness: .28, emissive: 0xffffff, emissiveMap: T_WIN, emissiveIntensity: 1.1 })),
  dirt: std(0xffffff, { map: T_DIRT, roughness: 1 }),
  grass: std(0xffffff, { map: T_GRASS, roughness: 1 }),
  wood: std(0x8a5a2b, { roughness: .9 }), woodD: std(0x5e3b1c, { roughness: .9 }),
  fence: std(0xf3efe6, { roughness: .8 }), hay: std(0xe4bb4f, { roughness: 1 }),
  barn: std(0xb0281f, { roughness: .75 }), roof: std(0x4a2a20, { roughness: .9 }),
  leaf: [0x3f9a3a, 0x58b044, 0x2f7f33].map(c => std(c, { roughness: .9, flatShading: true })),
  trunk: std(0x6b4423, { roughness: 1 }),
  wheat: std(0xe8c35a, { roughness: .9 }), crop: std(0x5fae3a, { roughness: .9 }),
  coin: std(0xffc928, { metalness: 1, roughness: .2, emissive: 0x5a3a00, emissiveIntensity: .6 }),
  tire: std(0x0c0c0e, { roughness: .85 }), rim: std(0xd8dbe0, { metalness: 1, roughness: .2 }),
  stone: std(0x9a9a9a, { roughness: .9, flatShading: true }),
};
const additive = (c, o = .8, map = null) => new THREE.MeshBasicMaterial({ color: c, map, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function mesh(geo, mat, cast = true, recv = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
const deco = (geo, mat) => mesh(geo, mat, false, true);
const neon = (geo, mat) => new THREE.Mesh(geo, mat);
function tileUV(geo, sx, sy) { const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy); uv.needsUpdate = true; return geo; }
// Extrusion d'un profil latéral (x du profil -> axe z du monde)
function extrudeX(shape, width, bevel) {

const PARTS = [], PART_N = 220; let pIdx = 0;
for (let i = 0; i < PART_N; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: T_GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  s.visible = false; s.userData = { life: 0 }; scene.add(s); PARTS.push(s);
}
function emit(x, y, z, o) {
  for (let i = 0; i < (o.n || 1); i++) {
    const s = PARTS[pIdx++ % PART_N], u = s.userData, sp = o.spread || 1;
    s.visible = true; s.position.set(x, y, z);
    u.vx = rnd(-sp, sp); u.vy = (o.up || 0) + rnd(-sp, sp); u.vz = (o.vz || 0) + rnd(-sp, sp);
    u.life = u.max = o.life * rnd(.7, 1.2); u.size = o.size || .4; u.grav = o.grav || 0; u.drift = o.drift !== false;
    s.material.color.setHex(o.color);
    const bl = o.normal ? THREE.NormalBlending : THREE.AdditiveBlending;
    if (s.material.blending !== bl) { s.material.blending = bl; s.material.needsUpdate = true; }
  }
}
function updateParts(dt) {
  for (const s of PARTS) {
    const u = s.userData; if (u.life <= 0) continue;
    u.life -= dt; if (u.life <= 0) { s.visible = false; continue; }
    u.vy -= u.grav * dt;
    s.position.x += u.vx * dt; s.position.y += u.vy * dt; s.position.z += (u.vz + (u.drift ? G.speed : 0)) * dt;
    const k = u.life / u.max; s.material.opacity = k; const sc = u.size * (.4 + k * .8); s.scale.set(sc, sc, 1);
  }
}

let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();

}
function toneAt(t, f1, f2, dur, type = 'sine', vol = .2, filt = 0) {
  const a = ac; const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);

  n.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .03);
}
let noiseBuf = null;
function noiseAt(t, dur, vol, freq, type = 'lowpass') {

  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + dur + .03);
}
function sfx(name) {
  if (save.mute || !audio()) return; const t = ac.currentTime;
  switch (name) {
    case 'coin': toneAt(t, 1318, 1318, .07, 'square', .045); toneAt(t + .06, 1975, 1975, .14, 'square', .045); break;
    case 'jump': toneAt(t, 240, 640, .2, 'triangle', .2); break;
    case 'slide': noiseAt(t, .3, .18, 1400); break;
    case 'lane': toneAt(t, 520, 760, .07, 'sine', .06); break;
    case 'bump': toneAt(t, 140, 70, .18, 'square', .12, 900); break;
    case 'crash': noiseAt(t, .7, .45, 700); toneAt(t, 160, 35, .6, 'sawtooth', .22, 1200); break;
    case 'power': [523, 659, 784, 1046, 1318].forEach((f, i) => toneAt(t + i * .06, f, f, .16, 'square', .05)); break;
    case 'tick': toneAt(t, 660, 660, .14, 'square', .06); break;
    case 'go': toneAt(t, 990, 990, .35, 'square', .07); toneAt(t, 1320, 1320, .35, 'square', .04); break;
    case 'land': noiseAt(t, .12, .1, 500); break;
  }
}

const music = { timer: null, next: 0, step: 0 };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function musicStart() {
  if (save.mute || !audio()) return; musicStop();
  music.next = ac.currentTime + .08; music.step = 0;
  music.timer = setInterval(() => {
    const bpm = world === 'city' ? 118 : 132, st = 60 / bpm / 2;
    while (music.next < ac.currentTime + .2) { playStep(music.step, music.next); music.next += st; music.step++; }
  }, 40);
}

function playStep(s, t) {
  const city = world === 'city';
  const prog = city ? [[45, 0], [41, 1], [48, 1], [43, 1]] : [[48, 1], [53, 1], [55, 1], [48, 1]];
  const [root, maj] = prog[(s >> 3) % 4], ch = maj ? [0, 4, 7, 12] : [0, 3, 7, 12];
  if (s % 2 === 0) toneAt(t, midi(root - 12), midi(root - 12), .22, city ? 'sawtooth' : 'triangle', city ? .08 : .1, city ? 500 : 0);
  const arp = city ? [0, 1, 2, 3, 2, 1, 2, 3] : [0, 2, 1, 3, 0, 2, 3, 1];
  toneAt(t, midi(root + 12 + ch[arp[s % 8]]), midi(root + 12 + ch[arp[s % 8]]), .13, city ? 'square' : 'triangle', city ? .022 : .05, city ? 2600 : 0);

  setTimeout(() => {
    if (G.state !== 'dead') return;
    $('fScore').textContent = sc; $('fCoins').textContent = G.coins; $('fBest').textContent = save.best;
    $('newRec').classList.toggle('hidden', !G.newRec);
    $('hud').classList.add('hidden'); $('over').classList.remove('hidden');
  }, 1100);
}

// ================= Contrôles =================
function act(a) {
  if (G.state !== 'run') return;
  if (a === 'L' && P.lane > 0) { P.prev = P.lane; P.lane--; sfx('lane'); }
  if (a === 'R' && P.lane < 2) { P.prev = P.lane; P.lane++; sfx('lane'); }
  if (a === 'U' && P.grounded && G.pw.fly <= 0) { P.vy = JUMP_V; P.grounded = false; P.slide = 0; sfx('jump'); }
  if (a === 'D' && G.pw.fly <= 0) { P.slide = .75; if (!P.grounded) P.vy = -24; sfx('slide'); }
}
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Escape' || k === 'p') { togglePause(G.state === 'run'); return; }
  if (k === 'Enter' && G.state === 'menu') { $('play').click(); return; }
  const m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', ' ': 'U', a: 'L', q: 'L', d: 'R', w: 'U', z: 'U', s: 'D' }[k];
  if (m) { e.preventDefault(); act(m); }
});
let sx = null, sy = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
cv.addEventListener('pointermove', e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.hypot(dx, dy) > 26) { Math.abs(dx) > Math.abs(dy) ? act(dx > 0 ? 'R' : 'L') : act(dy > 0 ? 'D' : 'U'); sx = null; }
});
addEventListener('pointerup', () => { sx = null; });
addEventListener('pointercancel', () => { sx = null; });

// ================= Boucle =================
function updateRun(dt) {
  const T = THEMES[world];
  G.dist += G.speed * dt;
  G.score += G.speed * dt * (G.pw.x2 > 0 ? 2 : 1);
  G.speed = Math.min(20 + G.dist / 45, 50);
  const d = clamp(G.dist / 3000, 0, 1);
  while (nextZ + wz > -180) { spawnRow(nextZ); nextZ -= lerp(24, 16.5, d); }

  // pouvoirs
  for (const k in G.pw) if (G.pw[k] > 0) { G.pw[k] -= dt; if (k === 'fly' && G.pw[k] <= 0) { G.inv = 1.6; P.vy = 0; } }
  G.inv = Math.max(0, G.inv - dt);
  P.slide = Math.max(0, P.slide - dt);
  P.x += (LANES[P.lane] - P.x) * damp(14, dt);

  // sol & collisions
  let floor = 0, hit = null;
  const flying = G.pw.fly > 0;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i], u = o.userData, oz = o.position.z + wz;
    if (oz - (u.len || 1) / 2 > 16) { worldGroup.remove(o); obstacles.splice(i, 1); continue; }
    if (Math.abs(o.position.x - P.x) > 1.35 || flying) continue;
    if (u.type === 'train') {
      const back = oz + u.len / 2, front = oz - u.len / 2;
      if (u.ramp && back <= 0 && back >= -RAMP) floor = Math.max(floor, u.H * (back + RAMP) / RAMP);
      if (0 > front - PL * .3 && 0 < back + PL * .5) {
        if (P.y >= u.H - .7 || G.inv > 0) floor = Math.max(floor, u.H);
        else hit = o;
      }
    } else if (u.type === 'low') {
      if (Math.abs(oz) < u.half + PL && P.y < u.H) hit = o;
    } else if (u.type === 'high') {
      if (Math.abs(oz) < u.half + PL && P.y < 3 && !(P.slide > 0 && P.y < .6)) hit = o;
    }
  }
  if (flying) { P.y = lerp(P.y, FLY_H, damp(3, dt)); P.vy = 0; P.grounded = false; }
  else {
    P.vy -= GRAV * dt; P.y += P.vy * dt;
    if (P.y <= floor) { if (!P.grounded && P.vy < -10) { sfx('land'); emit(P.x, floor + .1, 0, { n: 8, color: world === 'city' ? 0x2ff3ff : 0xd8c09a, spread: 2, up: 1, life: .4, size: .7, normal: world === 'farm' }); } P.y = floor; P.vy = 0; P.grounded = true; }
    else P.grounded = P.y - floor < .03;
  }
  P.floor = floor;
  if (hit && G.inv <= 0) {
    if (Math.abs(P.x - LANES[P.lane]) > .3 && P.prev !== P.lane) { P.lane = P.prev; G.shake = .35; G.inv = .3; sfx('bump'); if (navigator.vibrate) navigator.vibrate(30); }
    else { die(); return; }
  }

  // pièces
  const mag = G.pw.magnet > 0;
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i], cz = c.position.z + wz;
    c.rotation.y += dt * 5;
    if (cz > 12) { worldGroup.remove(c); coins.splice(i, 1); continue; }
    if (mag && cz > -18 && cz < 3) {
      const k = damp(9, dt);
      c.position.x = lerp(c.position.x, P.x, k); c.position.y = lerp(c.position.y, P.y + 1, k); c.position.z = lerp(c.position.z, -wz, k);
    }
    const czz = c.position.z + wz;
    if (Math.abs(c.position.x - P.x) < 1.1 && Math.abs(czz) < PL + .5 && Math.abs(c.position.y - (P.y + .9)) < 1.35) {
      c.getWorldPosition(tmpV);
      emit(tmpV.x, tmpV.y, tmpV.z, { n: 6, color: 0xffd23f, spread: 2.5, up: 2, life: .45, size: .45 });
      worldGroup.remove(c); coins.splice(i, 1); G.coins++; sfx('coin');
    }
  }
  // bonus
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i], pz = p.position.z + wz;
    p.userData.ring.rotation.y += dt * 3; p.userData.ring.rotation.x = .5; p.position.y = 1.3 + Math.sin(G.t * 3 + i) * .2;
    if (pz > 12) { worldGroup.remove(p); powers.splice(i, 1); continue; }
    if (Math.abs(p.position.x - P.x) < 1.2 && Math.abs(pz) < PL + .6 && Math.abs(p.position.y - (P.y + .9)) < 1.6) {
      const k = p.userData.ptype; G.pw[k] = PW[k].dur; sfx('power');
      p.getWorldPosition(tmpV); emit(tmpV.x, tmpV.y, tmpV.z, { n: 24, color: PW[k].color, spread: 4, up: 2, life: .7, size: .7 });
      worldGroup.remove(p); powers.splice(i, 1);
    }
  }
}

function animatePlayer(dt) {
  const u = player.userData, run = G.state === 'run' || G.state === 'dead';
  const air = run && !P.grounded, t = G.t;
  if (G.state === 'menu') {
    player.position.set(0, .3 + (u.kind === 'car' ? .06 + Math.sin(t * 2) * .05 : 0), 0);
    player.rotation.y += dt * .5; player.rotation.x = player.rotation.z = 0; player.scale.set(1, 1, 1);
  } else {
    const hover = u.kind === 'car' ? .1 + Math.sin(t * 6) * .03 : 0;
    player.position.set(P.x, P.y + hover, 0);
    player.rotation.y = lerp(player.rotation.y, 0, damp(10, dt));
    player.rotation.z = (P.x - LANES[P.lane]) * .1;
    player.rotation.x = u.kind === 'car' ? clamp(P.vy * .018, -.3, .3) : 0;
    const sy = P.slide > 0 ? .55 : 1;
    player.scale.y = lerp(player.scale.y, sy, damp(18, dt));
    player.visible = G.inv > 0 && G.state === 'run' ? Math.floor(t * 18) % 2 === 0 : true;
  }
  const spd = G.state === 'menu' ? 0 : G.speed;
  if (u.kind === 'car') {
    const hoverMode = air || G.pw.fly > 0;
    u.wheels.forEach(w => {
      w.tilt.rotation.z = lerp(w.tilt.rotation.z, hoverMode ? -w.side * Math.PI / 2 : 0, damp(10, dt));
      if (!hoverMode) w.spin.rotation.x -= spd * dt / .38;
    });
    u.flames.forEach(f => { f.visible = hoverMode && G.state !== 'dead'; f.scale.set(1, .7 + Math.random() * .7, 1); });
    u.under.material.opacity = .35 + Math.sin(t * 4) * .1 + (hoverMode ? .25 : 0);
    if (hoverMode && G.state === 'run') u.flames.forEach(f => { f.getWorldPosition(tmpV); emit(tmpV.x, tmpV.y - .3, tmpV.z, { color: 0x6fe9ff, spread: .3, up: -2, life: .35, size: .5 }); });
  } else {
    const ph = t * (spd * .5 + 2);
    const runAnim = G.state === 'run' && P.grounded;
    u.legs.forEach((l, i) => {
      const phase = u.chick ? i * Math.PI : (i === 0 || i === 3 ? 0 : Math.PI);
      const target = air ? (i < 2 ? -.6 : .6) : runAnim ? Math.sin(ph + phase) * .85 : 0;
      l.rotation.x = runAnim ? target : lerp(l.rotation.x, target, damp(12, dt));
    });
    u.rig.position.y = runAnim ? Math.abs(Math.sin(ph)) * .14 : 0;
    u.rig.rotation.x = runAnim ? Math.sin(ph * 2) * .04 : 0;
    u.rig.scale.y = G.state === 'menu' ? 1 + Math.sin(t * 2.5) * .02 : 1;
    u.wings.forEach((w, i) => { w.rotation.z = (i ? -1 : 1) * (air ? .4 + Math.sin(t * 32) * .8 : Math.sin(ph) * .15); });
    u.balloon.visible = G.pw.fly > 0;
    if (u.balloon.visible) u.balloon.rotation.z = Math.sin(t * 2) * .1;
    if (runAnim && Math.random() < .5) emit(P.x + rnd(-.5, .5), .15, .6, { color: 0xd8c09a, spread: .6, up: .8, life: .5, size: .6, normal: true });
  }
}

function updateCamera(dt) {
  const T = THEMES[world];
  let pos, look, fov;
  if (G.state === 'menu') {
    const a = G.t * .12;
    pos = tmpV.set(Math.sin(a) * 1.6 + 3.2, 2.1, 5.4 + Math.cos(a) * .6); look = tmpV2.set(0, 1, 0); fov = 50;
  } else {
    pos = tmpV.set(P.x * .55, 4.3 + P.y * .9, 8.4); look = tmpV2.set(P.x * .7, 1.3 + P.y * .85, -10);
    fov = 62 + (G.speed - 20) * .35 + (G.pw.fly > 0 ? 8 : 0);
  }
  const k = damp(G.state === 'menu' ? 2 : 5, dt);
  camera.position.lerp(pos, k); camLook.lerp(look, k);
  if (G.shake > 0) { camera.position.x += rnd(-1, 1) * G.shake * .4; camera.position.y += rnd(-1, 1) * G.shake * .4; G.shake = Math.max(0, G.shake - dt * 1.8); }
  camera.lookAt(camLook);
  camera.fov = lerp(camera.fov, fov, damp(3, dt)); camera.updateProjectionMatrix();
  skyGroup.position.copy(camera.position);
  sun.position.set(P.x + T.sunPos[0], T.sunPos[1], T.sunPos[2]); sun.target.position.set(P.x, 0, -6);
}

function updateHud() {
  $('score').textContent = Math.floor(G.score);
  $('coins').textContent = G.coins;
  $('multi').classList.toggle('hidden', !(G.pw.x2 > 0));
  for (const k in chips) {
    const on = G.pw[k] > 0; chips[k].classList.toggle('hidden', !on);
    if (on) chips[k].querySelector('b').style.width = (G.pw[k] / PW[k].dur * 100) + '%';
  }
}

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (G.state !== 'pause') {
    G.t += dt;
    if (G.state === 'menu') G.speed = 6;
    else if (G.state === 'count') G.speed = lerp(G.speed, 8, damp(2, dt));
    else if (G.state === 'dead') G.speed = Math.max(0, G.speed * (1 - dt * 5));
    wz += G.speed * dt; worldGroup.position.z = wz;
    segs.forEach(s => { if (s.position.z + wz > SEG * 1.5) s.position.z -= SEG * NSEG; });
    windmills.forEach(b => b.rotation.z += dt * .8);
    traffic.children.forEach(c => { c.position.z += (G.speed + c.userData.v) * dt; if (c.position.z > 40) c.position.z = -320; else if (c.position.z < -330) c.position.z = 30; });
    clouds.children.forEach(c => { c.position.z += (G.speed * .12 + 1) * dt; if (c.position.z > 40) c.position.z -= 360; });
    if (G.state === 'run') updateRun(dt);
    if (player) animatePlayer(dt);
    updateParts(dt);
    updateCamera(dt);
    if (G.state === 'run') updateHud();
  }
  if (composer && bloom && bloom.enabled) composer.render(); else renderer.render(scene, camera);
}

buildWorld();
enterMenu();
camera.position.set(4, 2.2, 6);
requestAnimationFrame(loop);
</script>
